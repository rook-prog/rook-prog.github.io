project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - files/*

website:
  title: "GISVENTURE"
  description: "Work worth building on. Remote sensing and GIS research, explorations and tools, shown with method, context and results."
  site-url: "https://gisventure.com"   # change to your domain once it is set up
  favicon: images/favicon.png
  open-graph: true
  page-navigation: false
  navbar:
    title: "Srijith Balan"
    right:
      - text: "GISVENTURE"
        href: gisventure/index.qmd
      - text: "Research"
        href: research.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "CartoZen"
        href: cartozen.qmd
      - text: "Mentoring"
        href: mentoring/index.qmd
      - text: "About"
        href: about.qmd
  page-footer:
    left: "GISVENTURE"
    right:
      - text: "LinkedIn"
        href: https://www.linkedin.com/in/sbislinkedhere
      - text: "GitHub"
        href: https://github.com/rook-prog/

format:
  html:
    theme:
      light: [cosmo, styles/theme.scss]
      dark: [cosmo, styles/theme.scss, styles/dark.scss]
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    fig-cap-location: bottom
