<section id="responses-section" style="margin-top: 3rem;">
  <h3>Respond to this exploration</h3>
  <p style="font-size: 0.9em; opacity: 0.8;">
    Thoughts, corrections, or questions are welcome. No account needed.
    Selected responses are added below the post with my reply.
  </p>
  <iframe id="tally-frame" width="100%" height="500" frameborder="0"
          title="Respond to this exploration"></iframe>
</section>

<script>
  // Put the form inside the main content, above the footer
  const sec = document.getElementById('responses-section');
  const main = document.querySelector('main');
  if (main && sec) main.appendChild(sec);

  if (document.querySelector('.quarto-listing')) { sec.remove(); throw 'listing page, no form'; }
  // Tell the form which page it's on
  const page = encodeURIComponent(location.pathname);
  document.getElementById('tally-frame').src =
    'https://tally.so/embed/pebG61?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1&page=' + page;
</script>
<script async src="https://tally.so/widgets/embed.js"></script>
